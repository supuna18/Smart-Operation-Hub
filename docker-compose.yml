services:
  backend:
    build: ./backend
    container_name: smart-operation-hub-backend
    ports:
      - "8082:8082"
    # මෙතන තිබුණ mongodb එකට අදාළ environment variable එක සහ depends_on අයින් කරන්න
    networks:
      - app-network

  frontend:
    build: ./frontend 
    container_name: smart-operation-hub-frontend
    ports:
      - "5174:5173"
    stdin_open: true
    tty: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# මෙතන යටින් තිබුණ mongodb service එක සම්පූර්ණයෙන්ම අයින් කරලා දාන්න