services:
  backend:
    build: ./backend
    container_name: smart-operation-hub-backend
    ports:
      - "8082:8082"
    # volumes කොටස අයින් කළා - මේකෙන් තමයි "Jar not found" ප්‍රශ්නය එන්නේ
    networks:
      - app-network

  frontend:
    build: ./frontend 
    container_name: smart-operation-hub-frontend
    ports:
      - "5174:5174" # Local 5174 එක container එකේ 5174 ට map කරනවා
    stdin_open: true
    tty: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge